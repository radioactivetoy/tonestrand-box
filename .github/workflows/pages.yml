# Publishes web/ (the flasher page) with GitHub Pages. The firmware it flashes is taken from the latest full (not pre-)release, so the page
# only ever offers a published release. The release workflow starts this one when it has published, and a push that changes web/ does too.
name: Pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Firmware from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fw web/firmware
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'tonestrand-box-web-firmware-*.zip' --dir /tmp/fw
          unzip -o /tmp/fw/*.zip -d web/firmware
          test -f web/firmware/manifest.json
          grep '"version"' web/firmware/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
